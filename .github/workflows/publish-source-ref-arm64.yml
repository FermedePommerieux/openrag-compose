name: Publish OpenRAG source ref for ARM64

# Build every fork-owned image from one explicit ref and publish it under the
# resolved commit SHA, an immutable retrieval-v2 release tag, and the mutable
# branch channel consumed by GitOps. The workflow remains manually triggered.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: pommerieux/v0.6.0
        type: string
      release_tag:
        description: Immutable image tag (for example v0.6.0-retrieval-v2.1)
        required: true
        default: v0.6.0-retrieval-v2.1
        type: string
      channel_tag:
        description: Mutable branch channel followed by GitOps
        required: true
        default: v0.6.0-retrieval-v2
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-openrag-arm64-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} for ARM64
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
          - name: langflow
            dockerfile: Dockerfile.langflow
          - name: opensearch
            dockerfile: Dockerfile

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Determine immutable image coordinates
        id: image
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          release_tag='${{ inputs.release_tag }}'
          channel_tag='${{ inputs.channel_tag }}'

          if [[ ! "${release_tag}" =~ ^v0\.6\.0-retrieval-v2\.[1-9][0-9]*$ ]]; then
            echo "Invalid immutable release tag: ${release_tag}" >&2
            exit 1
          fi
          if [[ "${channel_tag}" != "v0.6.0-retrieval-v2" ]]; then
            echo "Invalid branch channel tag: ${channel_tag}" >&2
            exit 1
          fi

          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "name=ghcr.io/${repository}/openrag-${{ matrix.name }}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "channel_tag=${channel_tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse to overwrite an existing release tag
        shell: bash
        run: |
          image='${{ steps.image.outputs.name }}:${{ steps.image.outputs.release_tag }}'
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            echo "Immutable release tag already exists: ${image}" >&2
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.release_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.channel_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=openrag-${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=openrag-${{ matrix.name }}-arm64

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "### OpenRAG ${{ matrix.name }}"
            echo
            echo "- SHA image: \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}\`"
            echo "- Release image: \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.release_tag }}\`"
            echo "- Branch channel: \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.channel_tag }}\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
